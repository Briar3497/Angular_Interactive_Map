<main>
  <div class="container">
    <div class="map-section">
      <app-svg (countrySelected)="onCountrySelected($event)"></app-svg>
    </div>
    <div class="info-section">
        <h1 class="title">Interactive World Map</h1>
        <h2>Country: {{countryInfo().name}}</h2>
        <p>Capital: {{countryInfo().capitalCity}}</p>
        <p>Region: {{countryInfo().region}}</p>
        <p>Income Level: {{countryInfo().incomeLevel}}</p>
        <p>Longitude: {{countryInfo().longitude}}</p>
        <p>Latitude: {{countryInfo().latitude}}</p>
      </div>
    </div>
  </div>
</main>
