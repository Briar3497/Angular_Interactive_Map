<main>
  <div class="container">
    <div class="map-section">
      <router-outlet />
    </div>
    <div class="info-section">
      <h1>Interactive World Map</h1>
      <h2>Country: country.name</h2>
      <p>Capital: country.capitalCity</p>
      <p>Region: country.region.value</p>
      <p>Income Level: country.incomeLevel.value</p>
      <p>Longitude: country.longitude</p>
      <p>Latitude: country.latitude</p>
    </div>
  </div>
</main>
